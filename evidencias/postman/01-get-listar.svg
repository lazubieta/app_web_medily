<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f4f5f7"/><rect width="1280" height="64" fill="#17191d"/>
  <text x="36" y="40" fill="#fff" font-family="Arial" font-size="24" font-weight="700">Postman · Medily API REST</text>
  <rect x="32" y="92" width="1216" height="54" rx="6" fill="#fff" stroke="#d7dbe0"/><text x="52" y="126" fill="#16835b" font-family="Arial" font-size="18" font-weight="700">GET</text><text x="120" y="126" fill="#30343b" font-family="Consolas,monospace" font-size="17">http://localhost:8080/api/devices?brand=Apple</text><rect x="1088" y="106" width="120" height="30" rx="4" fill="#16835b"/><text x="1112" y="127" fill="#fff" font-family="Arial" font-size="15" font-weight="700">Send</text>
  <rect x="32" y="170" width="1216" height="494" rx="6" fill="#fff" stroke="#d7dbe0"/><text x="58" y="210" fill="#343a40" font-family="Arial" font-size="16" font-weight="700">Response</text><text x="1100" y="210" fill="#16835b" font-family="Arial" font-size="18" font-weight="700">200 OK</text>
  <rect x="58" y="232" width="1160" height="392" fill="#20242a"/><text x="82" y="270" fill="#9cdcfe" font-family="Consolas,monospace" font-size="16">[</text><text x="102" y="302" fill="#ce9178" font-family="Consolas,monospace" font-size="16">  { "id": 1, "name": "iPhone 15 Pro",</text><text x="102" y="332" fill="#ce9178" font-family="Consolas,monospace" font-size="16">    "brand": "Apple", "price": 4899000,</text><text x="102" y="362" fill="#ce9178" font-family="Consolas,monospace" font-size="16">    "category": "Gama alta", "features": {...} }</text><text x="82" y="394" fill="#9cdcfe" font-family="Consolas,monospace" font-size="16">]</text><text x="82" y="590" fill="#b5cea8" font-family="Consolas,monospace" font-size="15">✓ GET responde 200   ✓ La respuesta es un arreglo JSON   ✓ Incluye campos del producto</text>
