<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Medily | Administracion</title><link rel="icon" href="/assets/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet">
</head>
<body class="admin-page bg-light">
<nav class="navbar bg-white border-bottom"><div class="container"><a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/"><span class="brand-mark">M</span> Medily</a><div class="d-flex gap-2"><a class="btn btn-sm btn-outline-secondary" href="/"><i class="bi bi-eye"></i> Ver sitio</a><button id="logout" class="btn btn-sm btn-outline-danger d-none">Cerrar sesion</button></div></div></nav>
<main class="container py-5">
    <section id="login-view" class="row justify-content-center"><div class="col-12 col-md-7 col-lg-5"><div class="card border-0 shadow-sm"><div class="card-body p-4 p-md-5"><span class="eyebrow">Modulo protegido</span><h1 class="h2 mt-2">Iniciar sesion</h1><p class="text-secondary">Accede para administrar el catalogo de Medily.</p><form id="login-form" class="mt-4"><label class="form-label" for="identity">Usuario o correo</label><input id="identity" class="form-control mb-3" value="admin@medily.com" required><label class="form-label" for="password">Contrasena</label><input id="password" class="form-control mb-3" type="password" value="Medily2026*" required><button class="btn btn-primary w-100" type="submit">Ingresar</button><div id="login-error" class="alert alert-danger mt-3 d-none"></div></form></div></div></div></section>
    <section id="dashboard-view" class="d-none"><div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><span class="eyebrow">Panel de control</span><h1 class="h2 mt-2 mb-0">Administracion del catalogo</h1></div><button id="new-device" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nuevo dispositivo</button></div><div id="admin-alert"></div><div class="card border-0 shadow-sm"><div class="card-header bg-white py-3"><ul class="nav nav-tabs card-header-tabs" role="tablist"><li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#devices-tab" type="button">Dispositivos</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#categories-tab" type="button">Categorias</button></li></ul></div><div class="card-body"><div class="tab-content"><div class="tab-pane fade show active" id="devices-tab"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Dispositivo</th><th>Marca</th><th>Categoria</th><th>Precio</th><th class="text-end">Acciones</th></tr></thead><tbody id="devices-table"></tbody></table></div></div><div class="tab-pane fade" id="categories-tab"><div class="d-flex justify-content-end mb-3"><button id="new-category" class="btn btn-outline-primary btn-sm"><i class="bi bi-plus-lg"></i> Nueva categoria</button></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Nombre</th><th>Descripcion</th><th class="text-end">Acciones</th></tr></thead><tbody id="categories-table"></tbody></table></div></div></div></div></div></section>
</main>
<div class="modal fade" id="device-form-modal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h2 id="device-form-title" class="h5 mb-0">Nuevo dispositivo</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><form id="device-form"><div class="modal-body"><input id="device-id" type="hidden"><div class="row g-3"><div class="col-md-8"><label class="form-label">Nombre</label><input id="device-name" class="form-control" required></div><div class="col-md-4"><label class="form-label">Marca</label><input id="device-brand" class="form-control" required></div><div class="col-md-4"><label class="form-label">Precio COP</label><input id="device-price" class="form-control" type="number" min="0" required></div><div class="col-md-4"><label class="form-label">Categoria</label><input id="device-category" class="form-control" required></div><div class="col-md-4"><label class="form-label">Fecha lanzamiento</label><input id="device-release" class="form-control" type="date"></div><div class="col-12"><label class="form-label">URL de imagen</label><input id="device-image" class="form-control"></div><div class="col-12"><label class="form-label">Descripcion</label><textarea id="device-description" class="form-control" rows="3"></textarea></div><div class="col-12"><label class="form-label">Caracteristicas (JSON)</label><textarea id="device-features" class="form-control font-monospace" rows="4" placeholder='{"display":"6.1 pulgadas","storage":"128 GB"}'>{}</textarea></div></div></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancelar</button><button class="btn btn-primary" type="submit">Guardar dispositivo</button></div></form></div></div></div>
<div class="modal fade" id="category-form-modal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h2 id="category-form-title" class="h5 mb-0">Nueva categoria</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><form id="category-form"><div class="modal-body"><input id="category-id" type="hidden"><label class="form-label">Nombre</label><input id="category-name" class="form-control mb-3" required><label class="form-label">Descripcion</label><textarea id="category-description" class="form-control" rows="3"></textarea></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancelar</button><button class="btn btn-primary" type="submit">Guardar categoria</button></div></form></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script src="/js/api.js"></script><script src="/js/admin.js"></script>
</body></html>
